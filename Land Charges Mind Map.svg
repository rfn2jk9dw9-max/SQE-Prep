<svg width="100%" viewBox="0 0 1040 966" xmlns="http://www.w3.org/2000/svg" role="img"><title>Land charges examinable core SQE1</title><desc>How third-party interests bind a buyer: registered land under LRA 2002 versus unregistered land under Land Charges Act 1972 key classes</desc><rect x="0" y="0" width="1040" height="966" fill="#ffffff"/><text x="520.0" y="52" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1c1c1a" text-anchor="middle" letter-spacing="0.2">LAND CHARGES — does it bind the buyer?</text><text x="520.0" y="80" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="0.2">SQE1 core  ·  first ask: is the land REGISTERED or UNREGISTERED?</text><rect x="24" y="98" width="488" height="66" rx="12" fill="#185FA5" stroke="#185FA5" stroke-width="2"/><text x="268.0" y="130" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">REGISTERED LAND</text><text x="268.0" y="152" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#eef4fb" text-anchor="middle" letter-spacing="0.3">LRA 2002</text><rect x="528" y="98" width="488" height="66" rx="12" fill="#0F6E56" stroke="#0F6E56" stroke-width="2"/><text x="772.0" y="130" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">UNREGISTERED LAND</text><text x="772.0" y="152" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#eef4fb" text-anchor="middle" letter-spacing="0.3">Land Charges Act 1972</text><rect x="24" y="180" width="488" height="124" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="44" y="212" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0C447C" text-anchor="start" letter-spacing="0.3">PROTECT ON THE REGISTER</text><text x="44" y="252" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">NOTICE</text><text x="222" y="252" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">covenants, contracts, easements</text><text x="44" y="284" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">RESTRICTION</text><text x="222" y="284" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">trusts → overreaching</text><rect x="24" y="320" width="488" height="180" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="44" y="352" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0C447C" text-anchor="start" letter-spacing="0.3">OVERRIDING INTERESTS — no registration</text><text x="44" y="372" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" letter-spacing="0">Schedule 3 LRA 2002</text><circle cx="58" cy="400" r="15" fill="#185FA5"/><text x="58" y="406" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="86" y="406" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">legal leases ≤ 7 years</text><circle cx="58" cy="434" r="15" fill="#185FA5"/><text x="58" y="440" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="86" y="440" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">persons in actual occupation</text><circle cx="58" cy="468" r="15" fill="#185FA5"/><text x="58" y="474" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="86" y="474" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">legal easements</text><rect x="24" y="516" width="488" height="92" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="44" y="548" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0C447C" text-anchor="start" letter-spacing="0.3">PRIORITY</text><text x="44" y="590" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">registration wins  ·  s.29 LRA 2002</text><rect x="24" y="624" width="488" height="92" rx="12" fill="#FBF1DE" stroke="#FAC775" stroke-width="2"/><text x="44" y="658" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#633806" text-anchor="start" letter-spacing="0.3">HOME RIGHTS (FLA 1996)</text><text x="44" y="690" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">NOT an interest → protect by a NOTICE;</text><text x="44" y="712" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">never an overriding interest</text><rect x="528" y="180" width="488" height="66" rx="12" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="2"/><text x="548" y="222" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#085041" text-anchor="start" letter-spacing="0">Register against the estate owner's NAME</text><rect x="528" y="262" width="488" height="334" rx="12" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="2"/><text x="548" y="294" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#085041" text-anchor="start" letter-spacing="0.3">KEY CLASSES  ·  s.2 LCA 1972</text><rect x="546" y="318" width="104" height="44" rx="9" fill="#0F6E56"/><text x="598.0" y="348.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">C(i)</text><text x="672" y="348.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">puisne mortgage (no deeds held)</text><rect x="546" y="372" width="104" height="44" rx="9" fill="#0F6E56"/><text x="598.0" y="402.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">C(iv)</text><text x="672" y="402.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">estate contract / option</text><rect x="546" y="426" width="104" height="44" rx="9" fill="#0F6E56"/><text x="598.0" y="456.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">D(ii)</text><text x="672" y="456.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">restrictive covenant (post-1925)</text><rect x="546" y="480" width="104" height="44" rx="9" fill="#0F6E56"/><text x="598.0" y="510.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">D(iii)</text><text x="672" y="510.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">equitable easement (post-1925)</text><rect x="546" y="534" width="104" height="44" rx="9" fill="#0F6E56"/><text x="598.0" y="564.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">F</text><text x="672" y="564.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">home rights (FLA 1996)</text><rect x="528" y="612" width="488" height="116" rx="12" fill="#F1EFE8" stroke="#A32D2D" stroke-width="2"/><text x="548" y="646" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#A32D2D" text-anchor="start" letter-spacing="0.3">NOT REGISTERED  →  VOID</text><text x="548" y="678" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">void vs a buyer for value  ·  s.4 LCA 1972</text><text x="548" y="708" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">actual notice is IRRELEVANT — Midland Bank v Green</text><rect x="528" y="744" width="488" height="84" rx="12" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="2"/><text x="548" y="778" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#085041" text-anchor="start" letter-spacing="0.3">NON-REGISTRABLE EQUITABLE INTERESTS</text><text x="548" y="810" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">→ doctrine of NOTICE (bona fide purchaser)</text><rect x="24" y="846" width="992" height="96" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="46" y="882" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0C447C" text-anchor="start" letter-spacing="0.4">GOLDEN RULE</text><text x="46" y="914" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">Registered → register a notice/restriction (or a Sch 3 overriding interest).</text><text x="46" y="936" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">Unregistered → register the LCA 1972 land charge — actual notice will not save an unregistered one.</text></svg>