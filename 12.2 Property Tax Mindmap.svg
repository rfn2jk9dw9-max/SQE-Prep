<svg width="100%" viewBox="0 0 1040 920" xmlns="http://www.w3.org/2000/svg" role="img"><title>Property tax rates and tranches SQE1 12.2</title><desc>Landscape memorization poster of SDLT England, LTT Wales and CGT rates and tranches</desc><rect x="0" y="0" width="1040" height="920" fill="#ffffff"/><text x="520.0" y="50" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1c1c1a" text-anchor="middle" letter-spacing="0.5">PROPERTY TAX  —  rates &amp; tranches</text><text x="520.0" y="74" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="1">SQE1 §12.2</text><rect x="24" y="90" width="488" height="58" rx="12" fill="#185FA5" stroke="#185FA5" stroke-width="2"/><text x="268.0" y="124" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SDLT</text><text x="268.0" y="143" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e8f0fb" text-anchor="middle" letter-spacing="0.5">ENGLAND  ·  pay HMRC</text><rect x="528" y="90" width="488" height="58" rx="12" fill="#3B6D11" stroke="#3B6D11" stroke-width="2"/><text x="772.0" y="124" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">LTT</text><text x="772.0" y="143" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e8f0fb" text-anchor="middle" letter-spacing="0.5">WALES  ·  pay WRA</text><rect x="24" y="162" width="237" height="86" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="40" y="188" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.5">RESIDENTIAL — 0% up to</text><text x="40" y="226" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">£125,000</text><rect x="275" y="162" width="237" height="86" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="291" y="188" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.5">NON-RESIDENTIAL — 0% up to</text><text x="291" y="226" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">£150,000</text><rect x="528" y="162" width="237" height="86" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="544" y="188" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.5">RESIDENTIAL — 0% up to</text><text x="544" y="226" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#3B6D11" text-anchor="start" letter-spacing="0">£225,000</text><rect x="779" y="162" width="237" height="86" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="795" y="188" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.5">NON-RESIDENTIAL — 0% up to</text><text x="795" y="226" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#3B6D11" text-anchor="start" letter-spacing="0">£225,000</text><rect x="24" y="264" width="992" height="72" rx="12" fill="#F1EFE8" stroke="#BA7517" stroke-width="2"/><text x="42" y="292" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#633806" text-anchor="start" letter-spacing="0.5">NOTIFIABLE  ≠  PAYABLE</text><text x="42" y="316" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c1c1a" text-anchor="start" letter-spacing="0">Consideration ≥ £40,000 → you MUST file the return, even if £0 tax is due.</text><text x="998" y="294" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="end" letter-spacing="0">Tax payable only ABOVE nil-rate band:</text><text x="998" y="318" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#633806" text-anchor="end" letter-spacing="0">SDLT £125k  ·  LTT £225k</text><rect x="24" y="352" width="488" height="284" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="44" y="382" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.6">COMMERCIAL / MIXED-USE BANDS</text><rect x="46" y="407.6666666666667" width="150" height="54" rx="10" fill="#185FA5"/><text x="121.0" y="449.6666666666667" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">0%</text><text x="222" y="443.6666666666667" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">£0 – £150k</text><rect x="46" y="485.0" width="150" height="54" rx="10" fill="#185FA5"/><text x="121.0" y="527.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">2%</text><text x="222" y="521.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">£150k – £250k</text><rect x="46" y="562.3333333333333" width="150" height="54" rx="10" fill="#185FA5"/><text x="121.0" y="604.3333333333333" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">5%</text><text x="222" y="598.3333333333333" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">above £250k</text><rect x="528" y="352" width="488" height="284" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="548" y="382" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.6">COMMERCIAL / MIXED-USE BANDS</text><rect x="550" y="398.0" width="150" height="54" rx="10" fill="#3B6D11"/><text x="625.0" y="440.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">0%</text><text x="726" y="434.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">£0 – £225k</text><rect x="550" y="456.0" width="150" height="54" rx="10" fill="#3B6D11"/><text x="625.0" y="498.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">1%</text><text x="726" y="492.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">£225k – £250k</text><rect x="550" y="514.0" width="150" height="54" rx="10" fill="#3B6D11"/><text x="625.0" y="556.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">5%</text><text x="726" y="550.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">£250k – £1m</text><rect x="550" y="572.0" width="150" height="54" rx="10" fill="#3B6D11"/><text x="625.0" y="614.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">6%</text><text x="726" y="608.0" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#1c1c1a" text-anchor="start" letter-spacing="0">above £1m</text><rect x="24" y="652" width="154" height="98" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="38" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.4">FIRST-TIME BUYER</text><text x="38" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">0% ≤ £300k</text><text x="38" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" letter-spacing="0">then 5% to £500k</text><rect x="190" y="652" width="154" height="98" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="204" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.4">EXTRA HOME / CO</text><text x="204" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#A32D2D" text-anchor="start" letter-spacing="0">+5%</text><text x="204" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A32D2D" text-anchor="start" letter-spacing="0">HRAD surcharge</text><rect x="356" y="652" width="154" height="98" rx="12" fill="#EAF2FB" stroke="#B5D4F4" stroke-width="2"/><text x="370" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C" text-anchor="start" letter-spacing="0.4">FILE + PAY</text><text x="370" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#185FA5" text-anchor="start" letter-spacing="0">14 days</text><text x="370" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" letter-spacing="0">SDLT5 → HMLR</text><rect x="528" y="652" width="154" height="98" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="542" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.4">FIRST-TIME BUYER</text><text x="542" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A32D2D" text-anchor="start" letter-spacing="0">None</text><text x="542" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A32D2D" text-anchor="start" letter-spacing="0">no relief in Wales</text><rect x="694" y="652" width="154" height="98" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="708" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.4">EXTRA HOME/CO/TRUST</text><text x="708" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#A32D2D" text-anchor="start" letter-spacing="0">+5%</text><text x="708" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A32D2D" text-anchor="start" letter-spacing="0">above main rates</text><rect x="860" y="652" width="154" height="98" rx="12" fill="#EDF4E2" stroke="#C0DD97" stroke-width="2"/><text x="874" y="676" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#27500A" text-anchor="start" letter-spacing="0.4">FILE + PAY</text><text x="874" y="710" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#3B6D11" text-anchor="start" letter-spacing="0">30 days</text><text x="874" y="734" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" letter-spacing="0">LTT receipt → HMLR</text><rect x="24" y="766" width="992" height="112" rx="12" fill="#FBF1DE" stroke="#FAC775" stroke-width="2"/><text x="42" y="796" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="start" letter-spacing="0.4">CGT ON RESIDENTIAL PROPERTY  —  rate set by where the gain falls in your income</text><text x="202.56" y="848" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#BA7517" text-anchor="middle" letter-spacing="0">18%</text><text x="202.56" y="870" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="0">gain within basic-rate band</text><text x="520.0" y="848" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#BA7517" text-anchor="middle" letter-spacing="0">24%</text><text x="520.0" y="870" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="0">higher / additional-rate part</text><text x="837.4399999999999" y="848" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#A32D2D" text-anchor="middle" letter-spacing="0">60 days</text><text x="837.4399999999999" y="870" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="0">report + pay after completion</text><line x1="361.28000000000003" y1="810" x2="361.28000000000003" y2="866" stroke="#FAC775" stroke-width="1.5"/><line x1="678.72" y1="810" x2="678.72" y2="866" stroke="#FAC775" stroke-width="1.5"/><text x="520.0" y="902" font-family="Anthropic Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle" letter-spacing="0">Test = where the PROPERTY sits, not the buyer.   ·   6+ dwellings or any mixed-use → NON-residential rates.</text></svg>