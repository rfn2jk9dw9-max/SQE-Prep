.filters{max-width:700px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.filter-btn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
.section-date{max-width:700px;margin:0 auto 8px;

.card{border-radius:12px;padding:12px 14px;cursor:pointer;

.card:hover{transform:translateY(-1px)}
.card-head{display:flex;align-items:center;gap:8px}
.card-code{font-size:11px;font-weight:700;letter-spacing:.4px;

function parseDate(s){ const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function toYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){
  if(!s) return '—';
  return parseDate(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtShort(s){
  if(!s) return '—';
  return parseDate(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function todayYMD(){ return toYMD(new Date()); }
// Filled in once buildFullPaperDays and its constants exist further down; empty
// until then, which is harmless because nothing schedules during parsing.
let FULL_PAPER_DAYS = {};
function isFreeDay(s){
  const d = parseDate(s);
  // Full-paper Sundays are not free: 170 questions across two 2h33m sittings
  // plus a break is most of the day, so nothing else is scheduled on them.
  return d.getDay() !== 6 && !COLP_BUSY.has(s) && !FULL_PAPER_DAYS[s];
}

// ── Persistence ────────────────────────────────────────────────────────────
const STORE_KEY   = 'sqe1_colp_rev_v3';
const COLP_API    = 'https://bidouillecode.dev/solicitor/colp_progress.php';

function loadDone(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return new Set(JSON.parse(raw));
  } catch {}
  return new Set(DEFAULT_DONE);
}

// When each chapter was ticked. The done set is only a list of codes, so
// without this there is no way to know how long ago a chapter was revised —
// and that is exactly what decides when it is due to come round again.
// Local-only and best-effort: chapters ticked before this existed have no date
// and fall back to their teaching date, which correctly treats them as cold.
const DONE_DATES_KEY = STORE_KEY + '_dates';

// Completed revisits: code -> date of the most recent one. Ticking a revisit
// has to record WHEN, not just that it happened — the next revisit is due
// 21 days after the last one, so a bare "done" flag would leave the scheduler
// computing from the first-pass date and offering it again far too soon.
const REVISIT_KEY = STORE_KEY + '_revisits';

// Stored as code -> [every completed revisit date], oldest first. The count is
// what keeps the rotation moving: without it, every page load forgot which
// chapters had already been revisited and restarted from CONT1.1, so the first
// twenty chapters looped every three weeks while later ones waited months.
function normRevisits(o){
  const out = {};
  if (!o || typeof o !== 'object') return out;
  Object.entries(o).forEach(([c, v]) => {
    const arr = (Array.isArray(v) ? v : [v])      // old format: a single date
      .filter(d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d));
    if (arr.length) out[c] = [...new Set(arr)].sort();
  });
  return out;
}

function loadRevisitLog(){
  try { return normRevisits(JSON.parse(localStorage.getItem(REVISIT_KEY))); }
  catch { return {}; }
}

function saveRevisitLogLocal(){
  try { localStorage.setItem(REVISIT_KEY, JSON.stringify(revisitLog)); } catch {}
}

function lastRevisit(code){
  const a = revisitLog[code];
  return a && a.length ? a[a.length - 1] : null;
}

function revisitCount(){
  return Object.values(revisitLog).reduce((n, a) => n + a.length, 0);
}

// Every change goes to the server through this queue. A POST that fails
// (offline, server down) stays queued in localStorage and is retried on the
// next load, so a tick is never silently lost. Operations are idempotent on
// the server (done replaces, revisits merge, unrevisit removes one date).
const PENDING_KEY  = STORE_KEY + '_pending';
const MIGRATED_KEY = STORE_KEY + '_revisits_synced';
let pending = (() => { try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || []; } catch { return []; } })();
let flushing = false;

function savePending(){
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); } catch {}
}

function queueOp(op){
  pending.push(op);
  savePending();
  flushPending();
}

async function flushPending(){
  if (flushing) return;
  flushing = true;
  try {
    while (pending.length) {
      const r = await fetch(COLP_API, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(pending[0])
      });
      // 4xx = the server refused this op (e.g. an older colp_progress.php that
      // only understands {done}); retrying never helps and would block every
      // later op, including first-pass ticks. 5xx / offline: keep and retry.
      if (!r.ok && r.status < 400) break;
      if (r.status >= 500) break;
      pending.shift();
      savePending();
    }
  } catch {}
  flushing = false;
}

// Tick / untick a revisit. Any upcoming revisit can be ticked — doing one ahead
// of its day is normal (and on COLP days there is no revisit slot at all). The
// date recorded is always today, the day it was actually done, and the rest of
// the schedule moves up. A done revisit shows in today's group and can be
// unticked there.
function toggleRevisit(code){
  const t = todayYMD();
  const arr = revisitLog[code] || [];
  if (arr.includes(t)) {
    revisitLog[code] = arr.filter(d => d !== t);
    if (!revisitLog[code].length) delete revisitLog[code];
    saveRevisitLogLocal();
    queueOp({ unrevisit: [{ code: code, date: t }] });
  } else {
    revisitLog[code] = [...arr, t].sort();
    saveRevisitLogLocal();
    queueOp({ revisits: { [code]: [t] } });
  }
  render();
}

function loadDoneDates(){
  try { return JSON.parse(localStorage.getItem(DONE_DATES_KEY)) || {}; }
  catch { return {}; }
}

function saveDoneDates(s){
  const today = todayYMD();
  s.forEach(code => { if(!doneDates[code]) doneDates[code] = today; });
  Object.keys(doneDates).forEach(code => { if(!s.has(code)) delete doneDates[code]; });
  try { localStorage.setItem(DONE_DATES_KEY, JSON.stringify(doneDates)); } catch {}
}

function saveDone(s){
  const arr = [...s];
  saveDoneDates(s);
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
  queueOp({ done: arr, done_dates: doneDates });
}

// Pull latest from server on load. The server holds the done set, the date
// each chapter was ticked and the full revisit history, so every device shows
// the same schedule.
async function syncFromServer(){
  await flushPending();            // send anything queued first
  try {
    const r = await fetch(COLP_API, { cache: 'no-store' });
    if(!r.ok) return;
    const data = await r.json();

    if (Array.isArray(data.done) && data.done.length) {
      done = new Set(data.done);
      localStorage.setItem(STORE_KEY, JSON.stringify(data.done));
    }

    // An older colp_progress.php returns only {done}: keep revisit history
    // local until the server can hold it, then migrate on a later load.
    if (!('revisits' in data)) { render(); return; }

    const sDates = (data.done_dates && typeof data.done_dates === 'object') ? data.done_dates : {};
    const sRev   = normRevisits(data.revisits);
    let migrated = false;
    try { migrated = localStorage.getItem(MIGRATED_KEY) === '1'; } catch {}

    if (!migrated) {
      // First load of this version on this device: upload what only this
      // browser knew (tick dates and revisits), then merge.
      const upDates = {}, upRev = {};
      Object.entries(doneDates).forEach(([c, d]) => { if (!sDates[c]) upDates[c] = d; });
      Object.entries(revisitLog).forEach(([c, a]) => {
        const miss = a.filter(d => !(sRev[c] || []).includes(d));
        if (miss.length) upRev[c] = miss;
      });
      if (Object.keys(upDates).length || Object.keys(upRev).length)
        queueOp({ done_dates: upDates, revisits: upRev });
      Object.entries(sRev).forEach(([c, a]) => {
        revisitLog[c] = [...new Set([...(revisitLog[c] || []), ...a])].sort();
      });
      Object.entries(sDates).forEach(([c, d]) => { doneDates[c] = d; });
      try { localStorage.setItem(MIGRATED_KEY, '1'); } catch {}
    } else {
      // After that the server is authoritative — local-only entries would be
      // revisits unticked on another device. Queued ops not yet accepted by the
      // server are re-applied on top so nothing ticked offline disappears.
      revisitLog = sRev;
      Object.keys(doneDates).forEach(c => { if (!sDates[c]) delete doneDates[c]; });
      Object.entries(sDates).forEach(([c, d]) => { doneDates[c] = d; });
      pending.forEach(op => {
        Object.entries(op.revisits || {}).forEach(([c, a]) => {
          revisitLog[c] = [...new Set([...(revisitLog[c] || []), ...a])].sort();
        });
        (op.unrevisit || []).forEach(({code, date}) => {
          if (!revisitLog[code]) return;
          revisitLog[code] = revisitLog[code].filter(d => d !== date);
          if (!revisitLog[code].length) delete revisitLog[code];
        });
      });
    }
    Object.keys(doneDates).forEach(c => { if (!done.has(c)) delete doneDates[c]; });
    try { localStorage.setItem(DONE_DATES_KEY, JSON.stringify(doneDates)); } catch {}
    saveRevisitLogLocal();
    render();
  } catch {}
}

let done = loadDone();
let doneDates = loadDoneDates();
let revisitLog = loadRevisitLog();

// ── Core: build spread schedule ────────────────────────────────────────────
// Returns {code: revDate | null}
function buildSchedule(doneSet) {
  const TODAY = todayYMD();

  // All free days from today to SCHED_END
  const freeDays = [];
  {
    let d = parseDate(TODAY);
    const end = parseDate(SCHED_END);
    while(toYMD(d) <= SCHED_END) {
      if(isFreeDay(toYMD(d))) freeDays.push(toYMD(d));
      d.setDate(d.getDate() + 1);
    }
  }

  // Pending modules: not done, has a COLP date
  // Earliest eligible = the day COLP taught it, clamped to today, snapped to a free day
  const pending = [];
  const nodateMap = {}; // code -> null (past deadline)

  MODULES.forEach(m => {
    if(!SEED_DATES[m.code]) return;
    if(doneSet.has(m.code)) return;

    let e = parseDate(SEED_DATES[m.code]);
    // clamp to today
    const todayD = parseDate(TODAY);
    if(e < todayD) e = new Date(todayD);
    // snap to next free day
    let safety = 0;
    while(safety++ < 120) {
      if(toYMD(e) > SCHED_END) { nodateMap[m.code] = null; return; }
      if(isFreeDay(toYMD(e))) break;
      e.setDate(e.getDate() + 1);
    }
    if(toYMD(e) > SCHED_END) { nodateMap[m.code] = null; return; }
    pending.push({ code: m.code, earliest: toYMD(e) });
  });

  // Sort by earliest eligible
  pending.sort((a,b) => a.earliest.localeCompare(b.earliest));

  // Greedy spread algorithm:
  // Iterate free days; maintain queue of eligible modules;
  // Each day assign ceil(remaining/freeRemaining) modules
  const assignment = {};
  const queue = []; // eligible but not yet assigned, in earliest order
  let pIdx = 0; // pointer into pending

  for(let fi = 0; fi < freeDays.length; fi++) {
    const day = freeDays[fi];
    // Drain newly eligible modules into queue
    while(pIdx < pending.length && pending[pIdx].earliest <= day) {
      queue.push(pending[pIdx++]);
    }
    if(queue.length === 0) continue;

    // How many to assign today?
    const freeRemaining = freeDays.length - fi;
    const totalRemaining = queue.length + (pending.length - pIdx);
    const perDay = Math.ceil(totalRemaining / freeRemaining);
    const toAssign = Math.min(perDay, queue.length);

    for(let i = 0; i < toAssign; i++) {
      assignment[queue.shift().code] = day;
    }
  }

  // Modules still in queue after all free days exhausted → no slot
  queue.forEach(m => { assignment[m.code] = null; });
  // Modules beyond deadline
  Object.assign(assignment, nodateMap);

  return assignment;
}

function freeDaysBetween(fromYMD, toExclusiveYMD) {
  const out = [];
  let d = parseDate(fromYMD);
  while (toYMD(d) < toExclusiveYMD) {
    if (isFreeDay(toYMD(d))) out.push(toYMD(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

const MOCK_API = 'https://bidouillecode.dev/solicitor/progress.php';
const WEAK_HALF_LIFE = 60;   // days
const WEAK_PRIOR = 4;        // pseudo-answers at the subject rate
// COLP retakes reuse the same questions, so a retake score is partly memory of
// those questions: it counts for less than a first attempt.
const RETAKE_WEIGHT = 0.5;

const NUM_TO_PREFIX = {};
MODULES.forEach(m => {
  const x = m.code.match(/^([A-Z]+)(\d+)\./);
  if (x) NUM_TO_PREFIX[x[2]] = x[1];
});
// Mock-exam subject names -> module prefix. Order matters: first match wins.
const SUBJECT_PREFIX = [
  ['criminal liability', 'CRML'], ['criminal', 'CRMP'], ['contract', 'CONT'],
  ['tort', 'TORT'], ['ethics', 'COND'], ['professional conduct', 'COND'],
  ['land law', 'LAND'], ['trust', 'TRUS'], ['business', 'BUS'],
  ['dispute', 'DISP'], ['legal services', 'SERV'], ['legal system', 'SYS'],
  ['property', 'PROP'], ['wills', 'WILL'], ['accounts', 'WILL'],
];
function prefixOfSubject(name) {
  const s = String(name || '').toLowerCase();
  const hit = SUBJECT_PREFIX.find(([k]) => s.includes(k));
  return hit ? hit[1] : null;
}
// "PROP12.5_ Pre-contract…", "CONT 1.5", "TORT 2.5 Nuissance" -> module code.
// The number is reliable; the letters in filenames are not.
function codeOfSource(src) {
  const m = String(src || '').match(/(?:^|[^\d.])(\d{1,2})\.(\d{1,2})(?!\d)/);
  if (!m || !NUM_TO_PREFIX[+m[1]]) return null;
  const code = NUM_TO_PREFIX[+m[1]] + (+m[1]) + '.' + (+m[2]);
  return SEED_DATES[code] ? code : null;
}

let mockEvents = [];   // [code | 'SUBJ:'+prefix, date, answered, wrong]

function computeWeakness() {
  const today = parseDate(todayYMD());
  const W = {}, N = {}, SW = {}, SN = {}, raw = {};
  let GW = 0, GN = 0;
  const valid = e => e[0] && e[2] && /^\d{4}-\d{2}-\d{2}$/.test(e[1]);
  const events = TOPIC_TEST_STATS.concat(mockEvents).filter(valid);
  const decay = date =>
    Math.pow(0.5, Math.max(0, (today - parseDate(date)) / 864e5) / WEAK_HALF_LIFE);
  let rawN = 0, wN = 0;
  const wt = e => decay(e[1]) * (e[4] ? RETAKE_WEIGHT : 1);
  events.forEach(e => { rawN += e[2]; wN += e[2] * wt(e); });
  const scale = wN ? rawN / wN : 1;
  const add = (key, date, n, w, retake) => {
    const k = decay(date) * (retake ? RETAKE_WEIGHT : 1) * scale;
    const code = key.startsWith('SUBJ:') ? null : key;
    const p = code ? code.match(/^[A-Z]+/)[0] : key.slice(5);
    SW[p] = (SW[p] || 0) + k * w;  SN[p] = (SN[p] || 0) + k * n;
    GW += k * w;  GN += k * n;
    if (code) {
      W[code] = (W[code] || 0) + k * w;  N[code] = (N[code] || 0) + k * n;
      const r = raw[code] = raw[code] || [0, 0];
      r[0] += w;  r[1] += n;
    }
  };
  events.forEach(e => add(...e));
  const G = (GW + 1) / (GN + 5);
  const out = {};
  MODULES.forEach(m => {
    const p = m.code.match(/^[A-Z]+/)[0];
    const ps = ((SW[p] || 0) + 5 * G) / ((SN[p] || 0) + 5);
    out[m.code] = {
      score: ((W[m.code] || 0) + WEAK_PRIOR * ps) / ((N[m.code] || 0) + WEAK_PRIOR),
      wrong: raw[m.code] ? raw[m.code][0] : 0,
      answered: raw[m.code] ? raw[m.code][1] : 0,
    };
  });
  return out;
}
let weakness = computeWeakness();

async function loadMockStats() {
  try {
    const r = await fetch(MOCK_API, { cache: 'no-store' });
    if (!r.ok) return;
    const sessions = await r.json();
    if (!Array.isArray(sessions)) return;
    const ev = [];
    sessions.forEach(s => {
      const d = String(s.datetime || '').slice(0, 10);
      if (Array.isArray(s.questions) && s.questions.length) {
        s.questions.forEach(q => {
          const code = codeOfSource(q.source);
          const p = code ? null : prefixOfSubject(q.subject);
          const key = code || (p ? 'SUBJ:' + p : null);
          ev.push([key, d, 1, q.isCorrect ? 0 : 1]);
        });
      } else {
        // Older saves kept only per-subject totals.
        Object.entries(s.subjects || {}).forEach(([name, v]) => {
          const p = prefixOfSubject(name);
          if (p && v && v.total) ev.push(['SUBJ:' + p, d, v.total, v.total - v.correct]);
        });
      }
    });
    mockEvents = ev;
    weakness = computeWeakness();
    render();
  } catch {}
}

function weakLabel(code) {
  const w = weakness[code];
  if (!w) return '';
  return w.answered
    ? Math.round(w.wrong) + ' of ' + Math.round(w.answered) + ' answers wrong'
    : 'no results yet — ranked on the subject';
}

function renderWeakPanel() {
  const el = document.getElementById('weakList');
  if (!el) return;
  const list = MODULES.filter(m => SEED_DATES[m.code] && weakness[m.code] && weakness[m.code].answered)
    .sort((a, b) => weakness[b.code].score - weakness[a.code].score)
    .slice(0, 12);
  el.innerHTML = list.map(m =>
    '<div class="weak-row"><span class="wc" style="color:' + codeColour(m.code) + '">' + m.code + '</span>'
    + '<span class="wt">' + m.title + '</span>'
    + '<span class="wn">' + Math.round(weakness[m.code].wrong) + '/' + Math.round(weakness[m.code].answered) + ' wrong</span></div>').join('')
    + '<div class="weak-note">Recalculated each time the page opens, from your COLP topic tests (retakes count half) and '
    + (mockEvents.length ? mockEvents.length + ' mock-exam answers' : 'mock exams (loading…)')
    + '. Recent answers count more. From 16 Dec, revisits take this order.</div>';
}

function buildSecondPass(assignment, doneSet) {
  // Session 2 of each day, from today through to the FLK2 exam. Every module
  // that has already had its first pass becomes eligible again SECOND_PASS_GAP
  // days later; each day takes whichever is coldest. That produces genuine
  // spacing — a module seen in August comes round again in September, and so
  // on — rather than a single re-read months later.
  const days = freeDaysBetween(todayYMD(), FLK2_EXAM);
  if (!days.length) return [];

  // Last time each module was seen.
  //
  // Ticked chapters are INCLUDED, not skipped. A completed first pass is what
  // qualifies a chapter for a second one; excluding them meant ticking a
  // chapter deleted it from the schedule permanently, and left revisits
  // starting at PROP12.4 — the first chapter that happened not to be ticked —
  // rather than at the coldest material.
  const lastSeen = {};
  MODULES.forEach(m => {
    if (!SEED_DATES[m.code]) return;
    let seen = doneSet.has(m.code)
      // ticked: when it was ticked, else fall back to the teaching date, which
      // treats a chapter ticked at an unknown past time as due.
      ? (doneDates[m.code] || SEED_DATES[m.code])
      : (assignment[m.code] || null);
    // A completed revisit is the most recent contact with the chapter, so it
    // supersedes both of the above and restarts the 21-day clock.
    const r = lastRevisit(m.code);
    if (r && (!seen || r > seen)) seen = r;
    lastSeen[m.code] = seen;
  });

  const out = [];
  // code -> revisits so far: completed ones first, then those scheduled below.
  // Seeding from the history is what makes the rotation continue where it left
  // off instead of restarting at CONT1.1 on every page load.
  const visits = {};
  Object.entries(revisitLog).forEach(([c, a]) => { visits[c] = a.length; });
  // Ticking today's revisit frees today's slot, so the next revisit moves up
  // into today and everything after it shifts forward — the same as ticking a
  // chapter in the first pass. The ticked one stays on today's list as done.
  // Revisits already made in the final phase, so one weak chapter does not
  // take every slot: its priority halves with each final-phase visit.
  const finalVisits = {};
  Object.entries(revisitLog).forEach(([c, a]) => {
    finalVisits[c] = a.filter(d => d >= POST_COLP_FROM).length;
  });
  const weakPriority = c => (weakness[c] ? weakness[c].score : 0) / (1 + (finalVisits[c] || 0));
  for (const day of days) {
    // After FLK1 is sat, FLK1 material is finished — that week belongs to FLK2
    // and to ethics, which is examined in both papers.
    const flk2Only = day > FLK1_EXAM;

    const eligible = Object.keys(lastSeen).filter(code => {
      if (flk2Only && paperOf(code) === 'FLK1') return false;
      // Nothing can be revised before COLP has taught it. Without this check a
      // module with no first-pass slot counted as "never revised" and was
      // scheduled immediately — putting CRMP9.12, taught 2 December, in August.
      if (SEED_DATES[code] > day) return false;
      const seen = lastSeen[code];
      if (!seen) return true;                 // taught but never revised
      const ready = parseDate(seen);
      ready.setDate(ready.getDate() + SECOND_PASS_GAP);
      return toYMD(ready) <= day;
    });
    if (!eligible.length) continue;

    // Fewest visits first, then chapter order. Both halves matter:
    //  • chapter order, because sorting by how long ago each was last seen
    //    mixed two clocks — ticked chapters carry their teaching date, unticked
    //    ones their first-pass date — so BUS7.8 came up before BUS7.2;
    //  • visit count, because chapter order ALONE starves the later chapters:
    //    the earliest eligible always wins, so BUS7.1 was revisited seven times
    //    before BUS7.2 was touched once.
    // Together they walk 1.1, 1.2, 1.3 … to the end, then start again.
    if (day >= POST_COLP_FROM) {
      // After the COLP exam: weakest first.
      eligible.sort((a, b) =>
        weakPriority(b) - weakPriority(a)
        || (visits[a] || 0) - (visits[b] || 0) || MODULE_ORDER[a] - MODULE_ORDER[b]);
    } else {
      eligible.sort((a, b) =>
        (visits[a] || 0) - (visits[b] || 0) || MODULE_ORDER[a] - MODULE_ORDER[b]);
    }
    const code = eligible[0];
    if (day >= POST_COLP_FROM) finalVisits[code] = (finalVisits[code] || 0) + 1;
    visits[code] = (visits[code] || 0) + 1;
    out.push({ code: code, date: day, phase: day >= POST_COLP_FROM ? 'final' : 'spaced' });
    lastSeen[code] = day;
  }
  return out;
}

// ── Full-length paper days ─────────────────────────────────────────────────
// SQE1 from the January 2027 sitting is 170 questions per FLK, sat as two
// 85-question sessions of 2h33m on non-consecutive days (SRA announcement of
// 10 September 2026; it was 180 as two of 90). Each session now tests a fixed
// subset of subjects rather than the whole paper. Short mocks never rehearse
// the length, and endurance is a separate skill — the COLP exam on 15 Dec
// should not be the first time.
const FULL_PAPER_START = '2026-10-01';
const FULL_PAPER_END   = '2026-12-12';
const FULL_PAPER_COUNT = 4;

function buildFullPaperDays() {
  // Sundays only. A full paper is two 2h33m sittings plus a break — most of a
  // day — so it needs a day with nothing else on it, not a weekday already
  // carrying a chapter and a revisit. Note this deliberately does NOT call
  // isFreeDay: isFreeDay now excludes these very days, so using it here would
  // be circular and would return nothing.
  //
  // COLP days are skipped: the progress taster on Sun 4 Oct sits in EXTRA_BUSY,
  // and a full paper on the same day was scheduled on top of it.
  //
  // The window is NOT cut at today. It used to be, which re-spread the four
  // papers across whatever Sundays were left every time the page loaded — so
  // dates drifted week by week (15 Nov became 22 Nov after 11 Oct) and a paper
  // already sat was replaced by a new one. Fixed dates; past ones are simply
  // not shown.
  const window = [];
  let d = parseDate(FULL_PAPER_START);
  while (toYMD(d) <= FULL_PAPER_END) {
    const ymd = toYMD(d);
    if (d.getDay() === 0 && !COLP_BUSY.has(ymd)) window.push(ymd);
    d.setDate(d.getDate() + 1);
  }
  if (!window.length) return {};
  const n = Math.min(FULL_PAPER_COUNT, window.length);
  const step = (window.length - 1) / Math.max(n - 1, 1);
  const out = {};
  for (let i = 0; i < n; i++) {
    out[window[Math.round(i * step)]] = (i % 2 === 0) ? 'FLK1' : 'FLK2';
  }
  return out;
}

// Resolve now that the constants above exist. isFreeDay reads this, so it must
// be set before anything builds a schedule.
FULL_PAPER_DAYS = buildFullPaperDays();

// ── Render ─────────────────────────────────────────────────────────────────
let activeFilter = 'all';

function getStatus(code, revDate) {
  if(done.has(code)) return 'done';
  if(revDate === null || revDate === undefined) return 'nodate';
  const t = todayYMD();
  if(revDate < t) return 'overdue';
  if(revDate === t) return 'today';
  return 'upcoming';
}

function render() {
  const assignment = buildSchedule(done);
  const TODAY = todayYMD();

  // Build enriched list
  const items = MODULES.map(m => ({
    ...m,
    colpDate: SEED_DATES[m.code] || null,
    revDate: done.has(m.code) ? null : (assignment[m.code] ?? null),
    status: getStatus(m.code, assignment[m.code]),
  }));

  // Revisits are shown ON the module's existing card, not as extra cards.
  // Pushing them as separate items tripled the length of the list and broke
  // ticking, because two cards sharing a code toggle the same done flag.
  const revisitList = buildSecondPass(assignment, done);
  const revisits = {};        // code -> [{date, phase}]  (shown on the card)
  const revisitsByDate = {};  // date -> [code]           (shown in the day group)
  revisitList.forEach(({ code, date, phase }) => {
    (revisits[code] = revisits[code] || []).push({ date: date, phase: phase });
    (revisitsByDate[date] = revisitsByDate[date] || []).push(code);
  });
  items.forEach(i => { i.revisits = revisits[i.code] || []; });
  // Revisits ticked today stay on today's group, shown as done.
  const revisitedToday = Object.keys(revisitLog)
    .filter(c => revisitLog[c].includes(TODAY))
    .sort((a, b) => MODULE_ORDER[a] - MODULE_ORDER[b]);
  const revDoneTotal = revisitCount();
  renderWeakPanel();

  // Stats
  const totalModules = MODULES.length;
  const doneCount = items.filter(i=>i.status==='done').length;
  const overdueCount = items.filter(i=>i.status==='overdue').length;
  const todayCount = items.filter(i=>i.status==='today').length;
  const pct = Math.round(doneCount/totalModules*100);

  // Free days count
  const freeDays = [];
  { let d = parseDate(TODAY); while(toYMD(d)<=SCHED_END){if(isFreeDay(toYMD(d)))freeDays.push(toYMD(d));d.setDate(d.getDate()+1);} }

  document.getElementById('pbFill').style.width = pct+'%';
  document.getElementById('pbLabel').textContent =
    doneCount+' of '+totalModules+' topics revised ('+pct+'%)';

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="stat-n">'+freeDays.length+'</div><div class="stat-l">Free days left</div></div>'+
    (overdueCount ? '<div class="stat" style="border-color:rgba(239,68,68,.4)"><div class="stat-n" style="color:#ef4444">'+overdueCount+'</div><div class="stat-l">Overdue</div></div>' : '')+
    (todayCount ? '<div class="stat" style="border-color:rgba(250,204,21,.4)"><div class="stat-n" style="color:#fbbf24">'+todayCount+'</div><div class="stat-l">Today</div></div>' : '')+
    '<div class="stat"><div class="stat-n">'+doneCount+'</div><div class="stat-l">Done</div></div>'+
    '<div class="stat"><div class="stat-n">'+revDoneTotal+'</div><div class="stat-l">Revisits done</div></div>';

  // Update filter button counts
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.filter;
    const cnt = f==='all' ? totalModules : items.filter(i=>i.status===f).length;
    btn.textContent = f==='all' ? 'All' :
      f==='overdue' ? 'Overdue'+(cnt?' ('+cnt+')':'') :
      f==='today'   ? 'Today'+(cnt?' ('+cnt+')':'') :
      f==='upcoming'? 'Upcoming'+(cnt?' ('+cnt+')':'') :
      f==='done'    ? 'Done'+(cnt?' ('+cnt+')':'') :
      'No slot'+(cnt?' ('+cnt+')':'');
  });

  // Filter
  const filtered = items.filter(i =>
    activeFilter==='all' ? true : i.status===activeFilter
  );

  const root = document.getElementById('root');
  root.innerHTML = '';

  if(!filtered.length && !(activeFilter === 'done' && revDoneTotal)) {
    root.innerHTML = '<div class="empty">No items in this category.</div>';
    return;
  }

  // Group by revDate (for upcoming/today/overdue), or just flat for done/nodate
  const groupByDate = ['overdue','today','upcoming','all'].includes(activeFilter);

  if(groupByDate) {
    // Sort: overdue by revDate asc, today first, upcoming asc, done/nodate last
    const sorted = [...filtered].sort((a,b) => {
      const order = {overdue:0, today:1, upcoming:2, done:3, nodate:4};
      if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
      if(a.revDate && b.revDate) return a.revDate.localeCompare(b.revDate);
      if(a.colpDate && b.colpDate) return a.colpDate.localeCompare(b.colpDate);
      return 0;
    });

    // Group by date bucket
    // A day's work is session 1 (a new chapter) plus session 2 (a revisit).
    // The revisit belongs in that day's group: showing it only as a line on the
    // module's own card — which sits under a different date entirely — meant
    // the day view never told you what to do on the day.
    const dayBuckets = {};   // date -> {modules:[], revisits:[], fullPaper:null}
    const tail = [];         // done / nodate, which are not date groups
    const bucketFor = d =>
      (dayBuckets[d] = dayBuckets[d] || {modules:[], revisits:[], fullPaper:null});

    sorted.forEach(item => {
      if (!item.revDate) { tail.push(item); return; }
      bucketFor(item.revDate).modules.push(item);
    });

    // Full-paper Sundays belong on their day, not in a banner at the top of the
    // page where they are read once and then never seen again.
    if (['all','today','upcoming'].includes(activeFilter)) {
      Object.entries(FULL_PAPER_DAYS).forEach(([date, flk]) => {
        if (date < TODAY) return;          // already sat
        if (activeFilter === 'today' && date !== TODAY) return;
        bucketFor(date).fullPaper = flk;
      });
    }

    // Revisit-only days need a group of their own, or they vanish entirely.
    if (['all','today','overdue','upcoming'].includes(activeFilter)) {
      Object.entries(revisitsByDate).forEach(([date, codes]) => {
        const st = date < TODAY ? 'overdue' : (date === TODAY ? 'today' : 'upcoming');
        if (activeFilter !== 'all' && activeFilter !== st) return;
        bucketFor(date).revisits.push(...codes);
      });
      if (revisitedToday.length && (activeFilter === 'all' || activeFilter === 'today'))
        bucketFor(TODAY).revisitsDone = revisitedToday;
    }

    Object.keys(dayBuckets).sort().forEach(date => {
      const bucket = dayBuckets[date];
      const st = date < TODAY ? 'overdue' : (date === TODAY ? 'today' : 'upcoming');
      const label =
        date === TODAY   ? '📅 Today – ' + fmtDate(date) :
        st === 'overdue' ? '⚠ Overdue – ' + fmtDate(date) :
        fmtShort(date);
      const section = document.createElement('div');
      section.innerHTML = '<div class="section-date">'+label+'</div>';
      const cardsEl = document.createElement('div');
      cardsEl.className = 'cards';
      if (bucket.fullPaper) cardsEl.appendChild(makeFullPaperRow(bucket.fullPaper, st));
      bucket.modules.forEach(i => cardsEl.appendChild(makeCard(i)));
      (bucket.revisitsDone || []).forEach(c => cardsEl.appendChild(makeRevisitRow(c, 'done', date)));
      bucket.revisits.forEach(c => cardsEl.appendChild(makeRevisitRow(c, st, date)));
      section.appendChild(cardsEl);
      root.appendChild(section);
    });

    // Completed and no-slot items keep their own trailing groups.
    let lastTail = null, tailEl = null;
    tail.forEach(item => {
      const bucket = item.status === 'done' ? 'done' : 'nodate';
      if (bucket !== lastTail) {
        const section = document.createElement('div');
        section.innerHTML = '<div class="section-date">'
          + (bucket === 'done' ? '✓ Completed' : '— No slot before the FLK1 exam')
          + '</div>';
        tailEl = document.createElement('div');
        tailEl.className = 'cards';
        section.appendChild(tailEl);
        root.appendChild(section);
        lastTail = bucket;
      }
      tailEl.appendChild(makeCard(item));
    });
  } else {
    const cardsEl = document.createElement('div');
    cardsEl.className = 'cards';
    filtered.forEach(item => cardsEl.appendChild(makeCard(item)));
    root.appendChild(cardsEl);
  }
  if (activeFilter === 'all' || activeFilter === 'done') appendRevisitHistory(root);
}

// Every completed revisit, most recent first. Read-only: a revisit is unticked
// from its row in today's group, the only day it can be ticked.
function appendRevisitHistory(root) {
  const codes = Object.keys(revisitLog);
  if (!codes.length) return;
  codes.sort((a, b) => lastRevisit(b).localeCompare(lastRevisit(a))
    || MODULE_ORDER[a] - MODULE_ORDER[b]);
  const section = document.createElement('div');
  section.innerHTML = '<div class="section-date">🔁 Revisits completed ('
    + revisitCount() + ')</div>';
  const cardsEl = document.createElement('div');
  cardsEl.className = 'cards';
  codes.forEach(code => {
    const m = MODULES.find(x => x.code === code) || { title: '' };
    const dates = revisitLog[code];
    const el = document.createElement('div');
    el.className = 'card s-done';
    el.style.cssText = 'cursor:default;padding:8px 14px;border-left:3px solid ' + codeColour(code);
    el.innerHTML =
      '<div class="card-head">'+
        '<span class="card-code" style="color:'+codeColour(code)+'">🔁 '+code+'</span>'+
        '<span class="card-title">'+m.title+'</span>'+
        '<span class="badge">'+dates.length+'×</span>'+
      '</div>'+
      '<div class="card-sub"><span>'+dates.map(fmtShort).join(' · ')+'</span></div>';
    cardsEl.appendChild(el);
  });
  section.appendChild(cardsEl);
  root.appendChild(section);
}

// A full-paper Sunday. Not a module, so not tickable — ticking it would write a
// bogus code into the done set and skew the progress count.
function makeFullPaperRow(flk, status) {
  const el = document.createElement('div');
  el.className = 'card s-' + status;
  el.style.cssText = 'border-left:3px solid #f59e0b;background:rgba(245,158,11,.06)';
  el.innerHTML =
    '<div class="card-head">'+
      '<span class="card-code" style="color:#f59e0b">⏱ '+flk+'</span>'+
      '<span class="card-title">Full paper — 170 questions in two sessions</span>'+
      '<span class="card-check"></span>'+
      '<span class="badge">Mock exam</span>'+
    '</div>'+
    '<div class="card-sub"><span style="opacity:.8">Session 1: 85 questions in 2h33m, '
      + 'break, then session 2: 85 more on the other half of the subjects. '
      + 'No answer-checking in between — the endurance is the point.</span></div>';
  return el;
}

// Session 2 of a day. Deliberately a slim row rather than a full card: the
// module already has exactly one tickable card elsewhere, and a second card
// sharing its code would toggle the same done flag.
function makeRevisitRow(code, status, date) {
  const m = MODULES.find(x => x.code === code) || { code: code, title: '' };
  const ticked = status === 'done';
  const tickable = true;
  const el = document.createElement('div');
  el.className = 'card s-' + status;
  el.style.cssText = 'opacity:.9;cursor:' + (tickable ? 'pointer' : 'default')
    + ';border-left:3px solid ' + codeColour(code);
  // Ticking records today's date in the revisit history (synced to the server)
  // and restarts the chapter's 21-day clock. It does NOT touch the chapter's
  // own done flag — that tracks the first pass.
  if (tickable) el.addEventListener('click', e => {
    if (e.target.closest('a')) return;   // let the COLP link through
    toggleRevisit(code);
  });
  const n = (revisitLog[code] || []).length;
  const weakPhase = date >= POST_COLP_FROM;
  el.innerHTML =
    '<div class="card-head">'+
      '<span class="card-code" style="color:'+codeColour(code)+'">🔁 '+code+'</span>'+
      '<span class="card-title">'+m.title+'</span>'+
      '<span class="card-check">'+(ticked ? '✓' : '')+'</span>'+
      '<span class="badge">'+(ticked ? '✓ Revisited' : (weakPhase ? '⚑ Weak spot' : 'Revisit'))+'</span>'+
    '</div>'+
    '<div class="card-sub">'+
      '<span style="opacity:.75">'+
        (ticked
          ? 'Session 2 done — revisit no. ' + n + ' · tap to undo'
          : 'Session 2 — recall first, then reread only what you could not retrieve'
            + (n ? ' · revisit no. ' + (n + 1) : ''))+
        (weakPhase && !ticked ? ' · ' + weakLabel(code) : '')+
      '</span>'+
      (CANVAS_URLS[code]
        ? '<a class="card-link" href="'+BASE+CANVAS_URLS[code]+'" target="_blank" rel="noopener">↗ Open on COLP</a>'
        : '')+
    '</div>';
  return el;
}

function makeCard(item) {
  const s = item.status;

  // Full-paper days are not a module and must not be tickable — clicking one
  // would write a bogus code into the done set and corrupt the progress count.
  if (item.fullPaper) {
    const el = document.createElement('div');
    el.className = 'card s-' + s;
    el.style.borderLeft = '3px solid #f59e0b';
    el.innerHTML =
      '<div class="card-head">' +
        '<span class="card-code" style="color:#f59e0b">⏱ ' + item.fullPaper + '</span>' +
        '<span class="card-title">' + item.title + '</span>' +
        '<span class="card-check"></span>' +
        '<span class="badge">' + (s === 'today' ? '📅 Today' : fmtDate(item.revDate)) + '</span>' +
      '</div>' +
      '<div class="card-sub"><span>Sit both halves in one day, with a break between. ' +
      'Do not check answers in between — the endurance is the point.</span></div>';
    return el;
  }

  const colour = codeColour(item.code);
  const badgeText = {
    done:     '✓ Done',
    today:    '📅 Today',
    overdue:  '⚠ Overdue',
    upcoming: fmtDate(item.revDate),
    nodate:   'After FLK1',
  }[s];

  const el = document.createElement('div');
  el.className = 'card s-'+s;
  el.innerHTML =
    '<div class="card-head">'+
      '<span class="card-code" style="color:'+colour+'">'+item.code+'</span>'+
      '<span class="card-title">'+item.title+'</span>'+
      '<span class="card-check">'+(s==='done'?'✓':'')+'</span>'+
      '<span class="badge">'+badgeText+'</span>'+
    '</div>'+
    '<div class="card-sub">'+
      '<span>📚 COLP: '+fmtDate(item.colpDate)+'</span>'+
      // Revisit dates are NOT repeated here: each revisit gets its own slim row
      // in the day it falls on, which is where it is actually actionable.
      // Listing them on the card as well was noise.
      (CANVAS_URLS[item.code]
        ? '<a class="card-link" href="'+BASE+CANVAS_URLS[item.code]+'" target="_blank" rel="noopener">↗ Open on COLP</a>'
        : '')+
    '</div>';
  el.addEventListener('click', e => {
    if(e.target.closest('a')) return; // don't toggle when clicking the COLP link
    if(done.has(item.code)) done.delete(item.code);
    else done.add(item.code);
    saveDone(done);
    render();
  });
  return el;
}

// ── Filters ────────────────────────────────────────────────────────────────
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-filter]');
  if(!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ── Reset ──────────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Reset all progress? This will restore CONT1.1–1.3 as done and clear all other marks.')) {
    done = new Set(DEFAULT_DONE);
    saveDone(done);
    render();
  }
});

// On load: render from localStorage immediately, then pull server state
render();
syncFromServer();
loadMockStats();
</script>
